[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debit"
version = "0.1.0"
description = "Lineage-aware, metadata-driven validation gates for data pipeline changes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DEBIT contributors" }]
keywords = ["data-quality", "pull-request", "validation", "fabric", "lineage", "ci"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "azure-identity>=1.15.0",
    "requests>=2.31.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/pratap-is-here/debit"
Issues = "https://github.com/pratap-is-here/debit/issues"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "constants",
    "metadata_parser",
    "validate_pr",
    "detect_impact",
    "freshness_validator",
    "fabric_jobs_client",
    "trigger_data_presence",
    "generate_lineage",
    "generate_registry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
# The Fabric notebook under fabric/ is not a standalone importable module
# (it relies on Fabric-injected globals like spark/mssparkutils and cell markers).
extend-exclude = ["fabric"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
